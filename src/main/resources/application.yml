spring:
  application:
    name: secure-document-processor

  # Datasource Configuration (PostgreSQL)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:document_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:2265132}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  # JPA & Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25

  # Flyway Database Migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always

# IBM MQ Connection Configuration
ibm:
  mq:
    queueManager: ${MQ_QMGR_NAME:DOCUMENT.QM}
    channel: ${MQ_CHANNEL:DEV.APP.SVRCONN}
    connName: ${MQ_CONN_NAME:localhost(1414)}
    user: ${MQ_USER:app}
    password: ${MQ_PASSWORD:passw0rd}
    pool:
      enabled: true
      max-connections: 10

# Application Custom Queue Names
app:
  mq:
    queues:
      request: ${MQ_REQUEST_QUEUE:DOCUMENT.REQUEST.QUEUE}
      success: ${MQ_SUCCESS_QUEUE:DOCUMENT.SUCCESS.QUEUE}
      backout: ${MQ_BACKOUT_QUEUE:DOCUMENT.BACKOUT.QUEUE}
      dlq: ${MQ_DLQ_NAME:SYSTEM.DEAD.LETTER.QUEUE}

# Logging Configuration
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.documentprocessor: DEBUG
    org.springframework.jms: INFO
    com.ibm.mq: WARN
